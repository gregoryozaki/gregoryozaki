name: Update Profile Metrics

on:
  schedule:
    # Executa a cada 6 horas.
    - cron: "17 */6 * * *"

  # Permite executar manualmente pela aba Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-metrics
  cancel-in-progress: false

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # CARDS PRINCIPAIS
      #
      # Gera:
      # - detalhes do perfil;
      # - linguagens por repositório;
      # - linguagens por commits;
      # - estatísticas;
      # - horário produtivo.
      # ---------------------------------------------------------
      - name: Generate profile summary cards
        continue-on-error: true
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: "-4"

          # Evita que arquivos .ipynb dominem o gráfico.
          EXCLUDE: "Jupyter Notebook"

          # Faz commit dos SVGs gerados.
          AUTO_PUSH: true

          # Gera apenas o tema utilizado no README.
          THEME: github_dark

          # Sem animação para manter visual mais formal.
          ANIMATION: ""

      # ---------------------------------------------------------
      # CALENDÁRIO ANUAL E SEQUÊNCIA DE DIAS
      #
      # Mostra:
      # - calendário anual;
      # - sequência atual;
      # - média de commits por dia;
      # - total de contribuições no período.
      # ---------------------------------------------------------
      - name: Generate contribution calendar and streak
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}

          filename: metrics-isocalendar.svg
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: America/Manaus

      # ---------------------------------------------------------
      # PULL REQUESTS E ISSUES
      #
      # Mostra PRs e issues criados pelo usuário.
      # ---------------------------------------------------------
      - name: Generate pull request and issue metrics
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}

          filename: metrics-followup.svg
          base: ""

          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_archived: no

          config_timezone: America/Manaus

      # ---------------------------------------------------------
      # HÁBITOS E GRÁFICOS DE ATIVIDADE
      #
      # Mostra:
      # - commits por horário;
      # - commits por dia da semana;
      # - atividade recente.
      # ---------------------------------------------------------
      - name: Generate coding activity charts
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}

          filename: metrics-habits.svg
          base: ""

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30

          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes

          # Desativa a repetição das linguagens neste gráfico.
          plugin_habits_languages_limit: 0

          config_timezone: America/Manaus
