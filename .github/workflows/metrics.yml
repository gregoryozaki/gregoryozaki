name: Update GitHub Metrics

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare output directories
        run: mkdir -p metrics profile-summary-card-output/github_dark

      - name: Generate summary cards
        continue-on-error: true
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: "-4"
          EXCLUDE: "Jupyter Notebook"
          AUTO_PUSH: false

      - name: Generate pull request and issue metrics
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/prs.svg
          base: ""
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_archived: no
          output_action: none
          config_timezone: America/Manaus

      - name: Generate current-year contribution calendar
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/calendar.svg
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
          output_action: none
          config_timezone: America/Manaus

      - name: Generate streak and activity graph
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_github_activity.py

      - name: Commit updated metrics
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output metrics

          if git diff --cached --quiet; then
            echo "No metric changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub profile metrics"
          git pull --rebase origin main
          git push origin main
