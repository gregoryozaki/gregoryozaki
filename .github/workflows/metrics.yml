name: Update Profile Metrics

on:
  schedule:
    # Executa a cada 6 horas.
    # Os horários do cron são interpretados em UTC.
    - cron: "17 */6 * * *"

  # Permite executar manualmente pela aba Actions.
  workflow_dispatch:

  # Executa quando este arquivo for alterado.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: github-profile-metrics
  cancel-in-progress: true

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # ---------------------------------------------------------
      # CARDS PRINCIPAIS
      # ---------------------------------------------------------
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: "-4"

          # Evita que notebooks dominem o gráfico de linguagens.
          EXCLUDE: "Jupyter Notebook"

          # Faz commit dos SVGs gerados.
          AUTO_PUSH: true

          # Gera somente o tema utilizado no README.
          THEME: github_dark

          # Sem animações.
          ANIMATION: ""

      # ---------------------------------------------------------
      # CALENDÁRIO ANUAL
      #
      # Gera:
      # metrics/calendar.svg
      # ---------------------------------------------------------
      - name: Generate contribution calendar
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Usa o token interno somente para gravar no repositório.
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: ${{ github.repository_owner }}
          filename: metrics/calendar.svg
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: America/Manaus

      # ---------------------------------------------------------
      # PULL REQUESTS E ISSUES
      #
      # Gera:
      # metrics/prs.svg
      # ---------------------------------------------------------
      - name: Generate pull request and issue metrics
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: ${{ github.repository_owner }}
          filename: metrics/prs.svg
          base: ""

          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_archived: no

          config_timezone: America/Manaus

      # ---------------------------------------------------------
      # HÁBITOS E ATIVIDADE
      #
      # Gera:
      # metrics/activity.svg
      #
      # O plugin Habits trabalha com no máximo 30 dias.
      # ---------------------------------------------------------
      - name: Generate coding activity charts
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: ${{ github.repository_owner }}
          filename: metrics/activity.svg
          base: ""

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30

          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes

          # Não repete o gráfico de linguagens.
          plugin_habits_languages_limit: 0

          config_timezone: America/Manaus

  # -------------------------------------------------------------
  # STREAK SEPARADO
  #
  # É executado depois dos outros cards para evitar conflitos
  # entre commits automáticos.
  #
  # Gera:
  # metrics/streak.svg
  # -------------------------------------------------------------
  update-streak:
    needs: update-metrics

    # Executa mesmo se algum card anterior falhar.
    if: ${{ always() }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&theme=github-dark-blue&locale=en&timezone=America/Manaus&disable_animations=true"
          path: metrics/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add metrics/streak.svg

          if git diff --cached --quiet; then
            echo "Streak SVG has not changed."
            exit 0
          fi

          git commit -m "chore: update streak stats"
          git push origin main
